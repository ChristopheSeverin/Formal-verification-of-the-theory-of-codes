name = "CodeTheoryProofs"
version = "0.2.0"
defaultTargets = ["ThreeWordCodes", "NonfreeBinaryFactor", "SubalgebraFreeness"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "ThreeWordCodes"
srcDir = "proofs/three-word-completion/lean"

[[lean_lib]]
name = "NonfreeBinaryFactor"
srcDir = "proofs/nonfree-binary-factor/lean"

[[lean_lib]]
name = "SubalgebraFreeness"
srcDir = "proofs/undecidable-subalgebra-freeness/lean"
